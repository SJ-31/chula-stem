[tasks.marimo_port]
run = '''
ssh -L 8023:localhost:8023 shannc@161.200.107.77 \
    ssh -L 8023:localhost:8023 cuaim-fat-01.cuaim.hpc
    '''

[tasks.sync_tests]
run = '''
unison ./tests ssh://$stem_ip/chula-stem/tests
'''

[tasks.sync_nextflow]
run = '''
unison ./nextflow ssh://$stem_ip/chula-stem/nextflow \
       -ignore 'Path nf_metrics' \
       -ignore 'Path bin' \
       -ignore 'Path .nextflow.*' \
       -ignore 'Path .nf-test' \
       -ignore 'Path .nextflow'
'''

[tasks.sync_pkgs]
run = '''
unison . ssh://$stem_ip/chula-stem \
       -path packages \
       -path src \
       -path pyproject.toml \
       -ignore 'Path packages/*/build' \
       -ignore 'Path packages/*/src/*.egg-info' \
       -ignore 'Path packages/*/.pytest_cache' \
       -ignore 'Name __pycache__' \
       -ignore 'Name _rust*'
'''
