__use_yte__: true
__definitions__:
  - from pathlib import Path
  - import sys
  - args = sys.argv
  - home = str(Path.home())
  - test = "test=True" in args
  - is_local = home.startswith("/home/shannc")
  - proj_root = f"{home}/Bio_SDD/chula-stem" if is_local else f"{home}/chula-stem"
  - data_root = f"{proj_root}/analyses/data_all" if is_local else "/data/project/stemcell/shannc"
  - conda_env = "stem-base" if is_local else "nf"
  - outdir = f"{data_root}/output/HCC/SCRNASEQ/cohort" if not test else f"{workdir}/test"

outdir: ?f"{proj_root}/analyses/output/pdac" # Root path for output
conda: ?conda_env # conda environment for reticulate

custom_sample_file: ?f"{proj_root}/analyses/pdac/snakemake/custom_samples.tsv"
# A TSV file containing samples to manually add to the VAF plot e.g.
# if no VCF data are available
# Columns must follow VEP's column naming format, with four required columns:
# Consequence, SYMBOL, HGVSc, and HGVSp

sample_spec:
  - manifest: ?f"{proj_root}/nextflow/input/manifests/pdac.csv" # Nextflow manifest file used for WES pipeline
    root: ?f"{data_root}/output/PDAC" # Root path of wes results
    cohort: "cohort"
  - manifest: ?f"{proj_root}/nextflow/input/manifests/pdac_prev.csv"
    root: ?f"{data_root}/output/PDAC" # Root path of wes results
    cohort: "prev_cohort"
  - manifest: ?f"{proj_root}/nextflow/input/manifests/pdac_phcase1.csv"
    cohort: "PHcase"
    root: ?f"{data_root}/output/PHCase"
    ignore:
      # - PHcase_12
      # - PHcase_15
      # - PHcase_1
      # - PHcase_4
      # - PHcase_2
      # The below aren't pdac
      - PHcase_8 # Breast
      - PHcase_11 # Breast
      - PHcase_18 # Sarcoma
      - PHcase_19 # Kidney
      - PHcase_21 # Colorectal

manifest:
src: # source directories
  py: ?f"{proj_root}/src/chula_stem"
  r: ?f"{proj_root}/src/R"

source_tag: "SOURCE"

variant_calling:
  paired: "detect" # One of "yes", "no", "detect", Set to "no" if results are from `wes_tumor_only`. Will autodetect otherwise
  min_alt_depth: 5 # Minimum depth that variants are counted in the plot
  protein_only: false
plot:
  dpi: 500
  width: 20
  height: 10

only_curated: False # Only allow named variants, regardless of type

sample_labels:
  # "Waddell Class":
  #   palette: "Manu::Korora"
  #   file: ?f"{proj_root}/analyses/pdac_subtyping/waddell_subtype.tsv"
  # "KRAS subtype":
  #   palette: "Manu::Hoiho"
  #   file: ?f"{proj_root}/analyses/pdac_subtyping/KRAS_imbalance_subtype.tsv"
  "KRAS G12 variant":
    palette: "tidyquant::tq_light"
    symbol: "KRAS"
    HGVSp:
      target: "ENSP00000256078.5:p.Gly12.*"
      other: "ENSP00000256078.5:.*"
  "Moffitt is basal-like":
    palette: "Manu::Hihi"
    file: ?f"{proj_root}/analyses/pdac_subtyping/moffitt_is_basal.tsv"

no_data_label: "no data"
add_label_samples: false # Add any samples that are found in the label files, but not
# in the exome pipeline (will be marked with `no_data_label`)

accepted_significance:
  default:
    - likely_pathogenic
    - pathogenic
    # - uncertain_significance
    - risk_factor
  symbols: # symbol-specific filters. Leave null for no filtering
    SMAD4:

accepted_consequence: # Only these variant types are plotted, if !`only_curated`
  # follows naming convention for variant consequences used by VEP
  # See https://grch37.ensembl.org/info/genome/variation/prediction/predicted_data.html
  default:
    - "missense_variant"
    - "frameshift_variant"
    - "downstream_gene_variant"
    - "upstream_gene_variant"
    - "intron_variant"
    - "3_prime_UTR_variant"
    - "stop_gained"
    - "splice_region_variant"
    - "inframe_deletion"
    - "splice_donor_5th_base_variant"
    - "NMD_transcript_variant"

individual_gene_plots:
  wanted: ["TP53", "KRAS", "SMAD4", "CDKN2A"]
  palette_c:
  width: 20
  palette_d:
  dpi: 500

