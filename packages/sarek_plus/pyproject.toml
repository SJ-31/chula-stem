[project]
version = "0.1"
name = "sarek_plus"
requires-python = ">=3.13"
dependencies = [
  "click",
  "reportlab",
  "pyhere",
  "duckdb",
  "pymupdf",
  "pyarrow",
  "polars",
  "pandera[polars]",
  "intervaltree",
  "gql[aiohttp]",
  "requests",
]
[dependency-groups]
dev = ["pytest", "icecream", "ipython"]

[project.scripts]
update_gene_cache = "sarek_plus:update_gene_cache"
format_vep_vcf = "sarek_plus.format_vep_vcf:main"
extract_vcf_format = "sarek_plus.format_vep_vcf:extract_vcf_format"
make_sarek_manifest = "sarek_plus.manifest:make_sarek_manifest"
classify_cnv_format = "sarek_plus:classify_cnv_format"
merge_cnv_calls = "sarek_plus:merge_cnv_calls"
callset_qc = "sarek_plus.callset_qc:qc_main"
pipeline_report = "sarek_plus:entry_point"
