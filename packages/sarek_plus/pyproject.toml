[project]
version = "0.1"
name = "sarek_plus"
requires-python = ">=3.13"
dependencies = [
  "click",
  "reportlab",
  "duckdb",
  "pymupdf",
  "polars",
  "pandera[polars]",
  "gql[aiohttp]",
  "requests",
]

[project.scripts]
get_therapy_cache = "sarek_plus:therapy_cache_from_files"
format_vep_vcf = "sarek_plus.format_vep_vcf:main"
classify_cnv_format = "sarek_plus:classify_cnv_format"
callset_qc = "sarek_plus.callset_qc:qc_main"
pipeline_report = "sarek_plus:entry_point"
