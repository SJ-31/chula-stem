[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "chula_stem"
requires-python = ">=3.12"
dependencies = ["sarek_plus", "stem_analysis", "pytest"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.uv.sources]
sarek_plus = { path = "packages/sarek_plus" }
stem_analysis = { path = "packages/stem_analysis" }

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "chula_stem._rust"
